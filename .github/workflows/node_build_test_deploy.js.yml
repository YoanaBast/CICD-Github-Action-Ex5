# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI test deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build_test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
    - name: Install NPM dependencies
      run: npm install
    - name: Replace config.js with production settings
      run: |
        echo "export const settings = { host: 'http://localhost:3030' }" > src/config.js
    - name: Start Backend
      run: npm run start-be &
    - name: Wait for backend to be ready
      run: sleep 3
    - name: Start FrontEnd
      run: npm run start-fe &
    - name: Wait for frontend to be ready
      run: sleep 3
    - name: Install the Playwright Browsers
      run: npx playwright install
    - name: Run the UI Tests
      run: npm run test


  deploy_backend_to_render:
    needs: build_test
    if : github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: JorgeLNJunior/render-deploy@v1.5.0
      with:
        service_id: ${{ secrets.SRV_ID_BE }}
        api_key: ${{ secrets.RENDER_API }}
        wait_deploy: true

  deploy_frontend_to_render:
    needs: deploy_backend_to_render
    if : github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: JorgeLNJunior/render-deploy@v1.5.0
      with:
        service_id: ${{ secrets.SRV_ID_FE }}
        api_key: ${{ secrets.RENDER_API }}
        wait_deploy: true
